spring.application.name=NaiConverter
spring.main.web-application-type=none

# 감시할 폴더 경로 (필수)
converter.watch-folder=
# 저장 폴더 (비우면 watch-folder와 동일)
converter.output-folder=
# JPG 품질 (0.0 ~ 1.0)
converter.jpg-quality=0.85
# 변환 후 원본 PNG 삭제 여부
converter.delete-original=false
# 시작 시 기존 PNG 파일도 변환 여부
converter.process-existing=false
